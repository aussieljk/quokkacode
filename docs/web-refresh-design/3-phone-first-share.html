<script>
const SLUG = "threadbear.mikecann.app/s/quiet-otter-41";
const bear = (s=22) => `<svg class="bear" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6.2" cy="6.4" r="2.5"/><circle cx="17.8" cy="6.4" r="2.5"/><circle cx="12" cy="13.2" r="7.6" fill="var(--bg,#141414)"/><ellipse cx="12" cy="15.9" rx="3" ry="2.2"/><circle cx="9.1" cy="11.6" r=".5" fill="currentColor"/><circle cx="14.9" cy="11.6" r=".5" fill="currentColor"/><path d="M11.3 15.2h1.4"/></svg>`;

const shareIco = (s=17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>`;
const xIco = (s=13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
const dots = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`;

function shot(w){
  const s = w/640;
  return `<div style="width:${w}px;height:${Math.round(400*s)}px;overflow:hidden"><div class="shot" style="transform:scale(${s})">
  <div class="top"><span class="logo">acme</span><span class="nav"></span><span class="nav" style="width:38px"></span><span class="nav" style="width:52px"></span><span class="av"></span></div>
  <div class="body"><div class="side"><div>Profile</div><div class="on">Appearance</div><div>Notifications</div><div>Billing</div><div>Team</div></div>

   <div class="card"><div class="row"><div>Dark mode<small>Use a dark theme on every page</small></div><span class="tg on"></span></div>

// The thread itself, the same text everywhere it appears.
const T = {
  t1me: `Can you add a dark mode toggle to the settings page? Should remember what I pick`,
  t1: (w) => `<div class="worked">Worked for 4m 12s<span class="ch">›</span></div>
   <div class="reply"><p>Done. There's a Dark mode switch under Appearance in settings, and it remembers your pick.</p>
   <ul><li>The switch sets <code>data-theme="dark"</code> on the page</li><li>Colours come from CSS variables, so every page follows it</li><li>Your pick is kept in <code>localStorage</code>, and a first visit follows the system setting</li></ul>
   <p>Here's the settings page with it on:</p>${pic(w)}</div>`,
  t2me: `nice. header's still white in dark mode though`,
  t2: `<div class="worked">Worked for 1m 48s<span class="ch">›</span></div>
   <div class="reply"><p>Fixed. The header had its own <code>background: #fff</code>. It uses <code>var(--surface)</code> now, like the cards.</p><p>I looked for the same thing elsewhere and fixed two more: the footer and the sign-in modal.</p></div>`,
  t3me: `great, ship it`,
  t3: `<div class="worked">Worked for 2m 31s<span class="ch">›</span></div>
   <div class="reply"><p>Merged and deployed. The switch is live on the settings page.</p><ul><li>14 tests pass, 2 of them new for the switch</li><li>Nothing else went out with it</li></ul></div>`,
};
